
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">

        <style>

            body {
                font-family: Arial, sans-serif;
                background: #f5f5f5;
                margin: 0;
                padding: 30px;
                color: #222;
            }

            .container {
                max-width: 900px;
                margin: auto;
                background: white;
                padding: 35px;
                border-radius: 12px;
            }

            h1 {
                margin-bottom: 5px;
            }

            .date {
                color: #777;
                margin-bottom: 30px;
            }

            .retailer {
                border-top: 1px solid #ddd;
                padding-top: 25px;
                margin-top: 25px;
            }

            .stats {
                display: flex;
                gap: 15px;
                margin: 15px 0;
            }

            .stat {
                background: #f3f3f3;
                padding: 15px;
                border-radius: 8px;
                flex: 1;
            }

            .stat-number {
                font-size: 24px;
                font-weight: bold;
            }

            .change {
                padding: 10px 0;
                border-bottom: 1px solid #eee;
            }

            .price {
                font-weight: bold;
            }

            .footer {
                margin-top: 35px;
                color: #888;
                font-size: 13px;
            }

        </style>

    </head>

    <body>

        <div class="container">

            <h1>
                Reliance Digital Intelligence
            </h1>

            <div class="date">
                Daily Competitor Report

                2026-09-19

            </div>
    

            <div class="footer">
                Generated automatically by
                Reliance Digital Intelligence.
            </div>

        </div>

    </body>
    </html>
